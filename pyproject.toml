[project]
name = "logfire-pydantic"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web Framework
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typing-extensions>=4.16.0",
    # AI & LLM
    "pydantic-ai>=2.66.0",
    "openai>=3.45.0",
    "anthropic>=2.5.0",
    "genai-prices>=0.2.1",
    # Observability
    "logfire[asyncpg,fastapi,httpx,system-metrics]>=5.4.0",
    # Database
    "pgvector>=0.5.1",
    "sqlalchemy>=2.1.8",
    "asyncpg>=0.32.0",
    # Utilities
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "python-multipart>=0.0.33",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "render>=1.7.0",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
